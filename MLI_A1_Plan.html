<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLI 排课计算器</title>
<style>
  :root{
    --a0:#8257C4; --zj:#2FA07A; --wj:#3B9AD9; --exam:#E0901C; --bilan:#9B2D5E;
    --brand:#1FA0BE; --brand2:#4BAE7E;
    --ink:#1c2a35; --muted:#5f7183; --line:#e5ebf1; --bg:#f4f7f9; --card:#ffffff;
    --soft:#eef3f7; --danger:#d24b4b;
    --radius:12px; --shadow:0 1px 2px rgba(20,40,60,.06),0 6px 20px rgba(20,40,60,.06);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.55; font-size:15px;}
  .wrap{max-width:1160px; margin:0 auto; padding:22px 20px 90px}
  header.top{display:flex; align-items:center; gap:16px; margin-bottom:4px}
  header.top img{height:46px; width:auto; display:block}
  header.top .ti{border-left:1px solid var(--line); padding-left:16px}
  h1{font-size:20px; letter-spacing:-.3px; margin:0; font-weight:800}
  .sub{color:var(--muted); font-size:13px; margin:2px 0 20px}

  /* main tabs */
  .maintabs{display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--line)}
  .maintabs button{border:0; background:transparent; padding:11px 4px; margin-right:22px; font:inherit; font-size:15px; font-weight:700; color:var(--muted); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1px}
  .maintabs button.on{color:var(--ink); border-bottom-color:var(--brand)}

  .grid{display:grid; grid-template-columns:320px 1fr; gap:20px; align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .panel .pad{padding:16px}
  .panel h2{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; font-weight:700}
  .block+.block{margin-top:18px; padding-top:18px; border-top:1px solid var(--line)}

  label.field{display:block; font-size:13px; font-weight:600; margin-bottom:6px}
  input[type=date], input[type=text], select{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px; font:inherit; color:var(--ink); background:#fff; -webkit-appearance:none;}
  input:focus, select:focus{outline:2px solid var(--brand); outline-offset:1px; border-color:transparent}

  .seg{display:flex; background:var(--soft); border-radius:10px; padding:4px; gap:4px}
  .seg button{flex:1; border:0; background:transparent; padding:9px 8px; border-radius:7px; font:inherit; font-weight:700; color:var(--muted); cursor:pointer}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* class list */
  .clslist{display:flex; flex-direction:column; gap:7px}
  .clsitem{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:#fff}
  .clsitem.on{border-color:var(--brand); box-shadow:0 0 0 2px rgba(31,160,190,.14)}
  .clsitem .nm{font-weight:700; font-size:14px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .clsitem .mt{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--soft); color:var(--muted); flex:none}
  .clsitem .st{font-size:11px; color:var(--muted); flex:none; font-variant-numeric:tabular-nums}
  .clsitem .del{color:var(--danger); font-weight:800; cursor:pointer; padding:0 2px; opacity:.65}
  .clsitem .del:hover{opacity:1}

  .teacher-row{margin-bottom:13px}
  .teacher-row .thead{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .dot{width:10px; height:10px; border-radius:3px; flex:none}
  .tname{font-size:13px; font-weight:700}
  .days{display:flex; flex-wrap:wrap; gap:5px}
  .day{--c:var(--brand); min-width:34px; text-align:center; padding:6px 4px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; user-select:none; background:#fff;}
  .day.on{background:var(--c); border-color:var(--c); color:#fff}
  .perday{display:flex; align-items:center; gap:8px; margin-top:9px; font-size:12.5px; color:var(--muted)}
  .perday select{width:64px; padding:5px 8px}

  .hol-list{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto; padding-right:4px}
  .hol{display:flex; align-items:center; gap:10px; padding:7px 9px; border:1px solid var(--line); border-radius:9px; font-size:13px; cursor:pointer; background:#fff}
  .hol .hdate{font-variant-numeric:tabular-nums; font-weight:700; flex:none; width:78px}
  .hol .hname{color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hol .chk{width:17px;height:17px;border-radius:5px;border:1.5px solid #cbd5e1;flex:none;display:grid;place-items:center;color:#fff;font-size:11px}
  .hol.on{border-color:var(--brand)} .hol.on .chk{background:var(--brand); border-color:var(--brand)}
  .yeartabs{display:flex; gap:6px; margin-bottom:10px}
  .yeartabs button{flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px; font:inherit; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer}
  .yeartabs button.on{background:var(--brand); border-color:var(--brand); color:#fff}

  .leave-add{margin-top:6px}
  .leave-add .row1{display:grid; grid-template-columns:1fr 96px; gap:8px; margin-bottom:8px}
  .btn{border:0; border-radius:9px; padding:9px 14px; font:inherit; font-weight:700; cursor:pointer; background:var(--brand); color:#fff}
  .btn.ghost{background:var(--soft); color:var(--ink)}
  .btn.sm{padding:7px 11px; font-size:13px}
  .btn.block{width:100%; padding:12px; font-size:15px}
  .btn:active{transform:translateY(1px)}
  .leave-item{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--line)}
  .leave-item .x{margin-left:auto; color:var(--danger); cursor:pointer; font-weight:800; padding:0 4px}
  .scopepill{font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px; background:var(--soft); color:var(--muted)}

  .editor-head{display:flex; align-items:center; gap:12px; margin-bottom:16px}
  .editor-head input{font-size:16px; font-weight:700}

  /* results */
  .empty{color:var(--muted); text-align:center; padding:54px 20px; font-size:14px}
  .summary{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
  @media(max-width:560px){.summary{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px}
  .stat .k{font-size:12px; color:var(--muted); font-weight:600}
  .stat .v{font-size:18px; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums}

  .exam-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px}
  .ecard{border-radius:10px; padding:13px 15px; color:#fff}
  .ecard .lbl{font-size:12px; font-weight:700; opacity:.9}
  .ecard .d{font-size:18px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums}
  .ecard .w{font-size:12px; opacity:.9; margin-top:1px}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:18px}
  .card .chead{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--line); gap:12px; flex-wrap:wrap}
  .card .chead h3{margin:0; font-size:14px; font-weight:800}
  .viewtabs{display:flex; gap:4px; background:var(--soft); border-radius:8px; padding:3px}
  .viewtabs button{border:0; background:transparent; padding:5px 12px; border-radius:6px; font:inherit; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer}
  .viewtabs button.on{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.1)}

  .chips{padding:16px; display:flex; flex-wrap:wrap; gap:6px}
  .chip{display:inline-flex; flex-direction:column; align-items:center; min-width:46px; border-radius:8px; padding:6px; color:#fff; font-size:12px}
  .chip .cn{font-weight:800; font-size:13px; line-height:1.1}
  .chip .cd{font-size:10px; opacity:.92; font-variant-numeric:tabular-nums; margin-top:2px; white-space:nowrap}
  .chip.sep{background:transparent; color:var(--muted); min-width:14px; justify-content:center; font-weight:800}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line); white-space:nowrap}
  th{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; background:var(--card); position:sticky; top:0}
  td.n{font-variant-numeric:tabular-nums}
  tr.exam td{background:#fff7ec} tr.bilan td{background:#fbeef3}
  .tag{display:inline-flex; align-items:center; gap:6px; font-weight:700}
  .tag .sw{width:9px; height:9px; border-radius:3px; flex:none}
  .badge{font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px; color:#fff}
  .tblwrap{max-height:520px; overflow:auto}

  .cal{padding:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px}
  .month h4{margin:0 0 8px; font-size:13px; font-weight:800}
  .mgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
  .mgrid .wd{font-size:10px; color:var(--muted); text-align:center; font-weight:700; padding-bottom:2px}
  .cell{aspect-ratio:1; border-radius:7px; border:1px solid transparent; display:flex; flex-direction:column; align-items:center; padding-top:3px; font-size:11px}
  .cell .dd{color:var(--muted); font-variant-numeric:tabular-nums}
  .cell.hol{background:#fbecec} .cell.hol .dd{color:var(--danger)}
  .cell.has{border-color:var(--line); background:#fff}
  .cell .cdots{display:flex; gap:2px; margin-top:2px; flex-wrap:wrap; justify-content:center}
  .cdot{width:6px; height:6px; border-radius:50%}
  .cell.exam{box-shadow:0 0 0 2px var(--exam) inset} .cell.bil{box-shadow:0 0 0 2px var(--bilan) inset}

  .legend{display:flex; flex-wrap:wrap; gap:14px; padding:13px 16px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted)}
  .legend .li{display:flex; align-items:center; gap:6px}
  .legend .sw{width:11px; height:11px; border-radius:3px}

  .ov-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .ov-head .acts{display:flex; gap:8px; flex-wrap:wrap}
  .ov-table td.mid{color:var(--exam); font-weight:700} .ov-table td.fin{color:var(--exam); font-weight:700}
  .ov-table td.bil{color:var(--bilan); font-weight:700}
  .ov-table td.err{color:var(--danger)}
  .ov-table tbody tr:hover td{background:#f8fbfc}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .note{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5}

  @media print{
    body{background:#fff}
    .maintabs,.no-print,aside{display:none!important}
    .wrap{max-width:none;padding:0}
    .card{box-shadow:none;border-color:#ccc}
  }
</style>
</head>

    <div class="ti"><h1>排课计算器</h1></div>
  </header>
  <p class="sub">按班级把 A0 语音 3 堂 + A1 阶段共 29 堂铺进真实日历，自动跳过法定假日与请假日；教务可管理多个班级，最后在「汇总总览」一次导出所有班的考试与结课日期。</p>

  <div class="maintabs">
    <button data-tab="setup" class="on">班级设置</button>

  <!-- ===================== 班级设置 ===================== -->
  <div id="tab-setup">
    <div class="grid">
      <aside>
        <div class="panel"><div class="pad">
          <div class="block" style="border:0;padding:0;margin:0">
            <h2>班级列表</h2>
            <div class="clslist" id="clsList"></div>
            <button class="btn ghost block sm" id="addClass" style="margin-top:10px">＋ 新建班级</button>
          </div>
        </div></div>

        <div class="panel" style="margin-top:16px"><div class="pad">
          <h2>校历 · 法定假日（全部班级共用）</h2>
          <div class="yeartabs" id="yearTabs">
            <button data-year="2026" class="on">2026</button>
            <button data-year="2027">2027</button>
          </div>

          </div>
        </div></div>

      <main>
        <div class="panel"><div class="pad" id="editor"></div></div>

      </div>

        <button class="btn" id="copyOv">复制表格</button>
        <button class="btn ghost" id="copyDetail">复制全部明细</button>

        <button class="btn ghost" id="printBtn">打印 / 存 PDF</button>

</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 类型 & 考试 ---------- */
const TYPES={A0:{name:'A0 语音',color:'#8257C4',short:'语音'},ZJ:{name:'中教 知识',color:'#2FA07A',short:'中'},WJ:{name:'外教 口语',color:'#3B9AD9',short:'外'}};
const EXAM={mid:{name:'期中',color:'#E0901C'},final:{name:'期末',color:'#E0901C'},bilan:{name:'Bilan 总测',color:'#9B2D5E'}};

function buildSequence(mode){
  const s=[]; let zj=0,wj=0;
  for(let i=1;i<=3;i++) s.push({type:'A0',idx:i,exam:null});
  if(mode==='full'){
    for(let r=0;r<5;r++){
      for(let k=0;k<3;k++){zj++; s.push({type:'ZJ',idx:zj,exam:null});}
      for(let k=0;k<2;k++){wj++; let ex=null; if(r===2&&k===1)ex='mid'; if(r===4&&k===1)ex='final'; s.push({type:'WJ',idx:wj,exam:ex});}
    }
    zj++; s.push({type:'ZJ',idx:zj,exam:'bilan'});
  }else{
    for(let r=0;r<8;r++){
      for(let k=0;k<2;k++){zj++; s.push({type:'ZJ',idx:zj,exam:null});}
      wj++; s.push({type:'WJ',idx:wj,exam:(r===4?'mid':null)});
    }
    zj++; s.push({type:'ZJ',idx:zj,exam:null});
    zj++; s.push({type:'ZJ',idx:zj,exam:'final'});
  }
  s.forEach((c,i)=>c.seq=i+1);
  return s;
}

/* ---------- 假日 ---------- */
const HOLIDAYS={
  2026:[['2026-01-01','元旦 Jour de l\'An'],['2026-02-16','家庭日 Jour de la famille'],['2026-04-03','耶稣受难日 Vendredi saint'],['2026-05-18','爱国者日 Journée des patriotes'],['2026-06-24','魁北克国庆 Saint-Jean-Baptiste'],['2026-07-01','加拿大国庆 Fête du Canada'],['2026-09-07','劳动节 Fête du Travail'],['2026-10-12','感恩节 Action de grâce'],['2026-12-25','圣诞节 Noël']],
  2027:[['2027-01-01','元旦 Jour de l\'An'],['2027-02-15','家庭日 Family Day'],['2027-03-26','耶稣受难日 Vendredi saint'],['2027-05-24','维多利亚日 Fête de la Reine'],['2027-06-24','圣让-巴蒂斯特 Saint-Jean-Baptiste'],['2027-07-01','加拿大国庆 Fête du Canada'],['2027-08-02','公民日 Congé civique'],['2027-09-06','劳动节 Fête du Travail'],['2027-10-11','感恩节 Action de grâce'],['2027-12-24','平安夜 Noël'],['2027-12-25','圣诞节 Noël']],
};

/* ---------- 状态 ---------- */
const WEEK=[{lbl:'一',js:1},{lbl:'二',js:2},{lbl:'三',js:3},{lbl:'四',js:4},{lbl:'五',js:5},{lbl:'六',js:6},{lbl:'日',js:0}];
const WD_CN=['周日','周一','周二','周三','周四','周五','周六'];
let CID=0;
function newClass(){
  CID++;
  return {id:CID, name:'班级 '+CID, mode:'full', start:'',
    days:{A0:[1,2,3,4,5],ZJ:[1,2,3,4,5],WJ:[1,2,3,4,5]},
    perDay:{A0:1,ZJ:1,WJ:1}, leaves:[]};
}
const state={ holEnabled:new Set(), classes:[], activeId:null, tab:'setup', year:2026, view:'chips' };
Object.values(HOLIDAYS).flat().forEach(([d])=>state.holEnabled.add(d));
state.classes.push(newClass()); state.activeId=state.classes[0].id;
const active=()=>state.classes.find(c=>c.id===state.activeId);

/* ---------- 工具 ---------- */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const md=d=>`${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd);};

function isBlocked(ds,type,cls){
  if(state.holEnabled.has(ds)) return true;
  for(const lv of cls.leaves){
    if(lv.date!==ds) continue;
    if(lv.scope==='all') return true;
    if(lv.scope==='ZJ'&&(type==='ZJ'||type==='A0')) return true;
    if(lv.scope==='WJ'&&type==='WJ') return true;
  }
  return false;
}
function computeSchedule(cls){
  if(!cls.start) return {error:'未设开班日期'};
  for(const t of ['A0','ZJ','WJ']) if(cls.days[t].length===0) return {error:`${TYPES[t].name} 无上课日`};
  const seq=buildSequence(cls.mode);
  let cursor=parse(cls.start); const placed={};
  for(const c of seq){
    let d=new Date(cursor),guard=0;
    while(guard++<6000){
      const ds=fmt(d);
      const okDay=cls.days[c.type].includes(d.getDay());
      const cap=((placed[ds]&&placed[ds][c.type])||0)<cls.perDay[c.type];
      if(okDay&&cap&&!isBlocked(ds,c.type,cls)) break;
      d.setDate(d.getDate()+1);
    }
    const ds=fmt(d); placed[ds]=placed[ds]||{A0:0,ZJ:0,WJ:0}; placed[ds][c.type]++;
    c.date=new Date(d); cursor=new Date(d);
  }
  return {seq};
}
function milestones(seq){
  const g=k=>seq.find(c=>c.exam===k);
  return {open:seq[0].date, a0:seq[2].date, mid:g('mid')?.date, final:g('final')?.date,
    bilan:g('bilan')?.date, close:seq[seq.length-1].date,
    weeks:Math.ceil((seq[seq.length-1].date-seq[0].date)/(7*864e5))+1};
}

/* ---------- 渲染：班级列表 ---------- */
function renderClassList(){
  const box=document.getElementById('clsList'); box.innerHTML='';
  state.classes.forEach(c=>{
    const el=document.createElement('div');
    el.className='clsitem'+(c.id===state.activeId?' on':'');
    const mt=c.mode==='full'?'全日制':'兼读制';
    el.innerHTML=`<span class="nm">${c.name}</span><span class="st">${c.start?md(parse(c.start)):'未设'}</span><span class="mt">${mt}</span><span class="del">×</span>`;
    el.onclick=e=>{ if(e.target.classList.contains('del')) return; state.activeId=c.id; renderAll(); };
    el.querySelector('.del').onclick=()=>{
      if(state.classes.length===1){ toast('至少保留一个班级'); return; }
      state.classes=state.classes.filter(x=>x.id!==c.id);
      if(state.activeId===c.id) state.activeId=state.classes[0].id;
      renderAll();
    };
    box.appendChild(el);
  });
}

/* ---------- 渲染：编辑器 ---------- */
function renderEditor(){
  const c=active(); const box=document.getElementById('editor');
  box.innerHTML=`
    <div class="editor-head">
      <input type="text" id="clsName" value="${c.name.replace(/"/g,'&quot;')}">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div><label class="field">开班日期</label><input type="date" id="clsStart" value="${c.start}"></div>
      <div><label class="field">班型</label>
        <div class="seg" id="clsMode">
          <button data-mode="full"${c.mode==='full'?' class="on"':''}>全日制</button>
          <button data-mode="part"${c.mode==='part'?' class="on"':''}>兼读制</button>
        </div>
      </div>
    </div>
    <p class="note">${c.mode==='full'?'中中中 + 外外 ×5 轮，期中=外教第 6 堂、期末=外教第 10 堂，末堂中教 Bilan。':'中中 + 外 ×8 轮，末补两堂中教，期中=外教第 5 堂、期末=中教第 18 堂。'}</p>

    <div class="block"><h2>每周上课日</h2><div id="teachers"></div>
      <p class="note">中教/外教可设不同上课日；系统按 29 堂顺序排到最近的可上课日。全日制一天多堂就调「每天最多堂数」。</p></div>

    <div class="block"><h2>本班请假 / 临时停课</h2>
      <div class="leave-add">
        <div class="row1"><input type="date" id="leaveDate"><select id="leaveScope"><option value="all">全班</option><option value="ZJ">中教</option><option value="WJ">外教</option></select></div>
        <button class="btn sm block" id="leaveAdd">＋ 添加</button>
      </div>
      <div id="leaveList" style="margin-top:8px"></div>
    </div>`;

  document.getElementById('clsName').oninput=e=>{c.name=e.target.value||('班级 '+c.id); renderClassList();};
  document.getElementById('clsStart').onchange=e=>{c.start=e.target.value; renderClassList(); renderDetail();};
  box.querySelectorAll('#clsMode button').forEach(b=>b.onclick=()=>{c.mode=b.dataset.mode; renderClassList(); renderEditor(); renderDetail();});
  renderTeachers(c);
  renderLeaves(c);
  document.getElementById('leaveAdd').onclick=()=>{
    const d=document.getElementById('leaveDate').value; if(!d){toast('请选择日期');return;}
    const scope=document.getElementById('leaveScope').value;
    if(!c.leaves.some(l=>l.date===d&&l.scope===scope)) c.leaves.push({date:d,scope});
    document.getElementById('leaveDate').value=''; renderLeaves(c); renderDetail();
  };
}
function renderTeachers(c){
  const box=document.getElementById('teachers'); box.innerHTML='';
  for(const t of ['A0','ZJ','WJ']){
    const row=document.createElement('div'); row.className='teacher-row';
    row.innerHTML=`<div class="thead"><span class="dot" style="background:${TYPES[t].color}"></span><span class="tname">${t==='A0'?'A0 语音':TYPES[t].name}</span></div>`;
    const days=document.createElement('div'); days.className='days';
    WEEK.forEach(w=>{
      const b=document.createElement('div'); b.className='day'+(c.days[t].includes(w.js)?' on':'');
      b.style.setProperty('--c',TYPES[t].color); b.textContent=w.lbl;
      b.onclick=()=>{const a=c.days[t]; const i=a.indexOf(w.js); if(i>=0)a.splice(i,1);else a.push(w.js); b.classList.toggle('on'); renderDetail();};
      days.appendChild(b);
    });
    row.appendChild(days);
    const pd=document.createElement('div'); pd.className='perday';
    pd.innerHTML=`每天最多 <select><option>1</option><option>2</option><option>3</option></select> 堂`;
    pd.querySelector('select').value=c.perDay[t];
    pd.querySelector('select').onchange=e=>{c.perDay[t]=+e.target.value; renderDetail();};
    row.appendChild(pd); box.appendChild(row);
  }
}
function renderLeaves(c){
  const box=document.getElementById('leaveList'); box.innerHTML='';
  const cn={all:'全班',ZJ:'中教',WJ:'外教'};
  [...c.leaves].sort((a,b)=>a.date<b.date?-1:1).forEach(lv=>{
    const dd=parse(lv.date); const el=document.createElement('div'); el.className='leave-item';
    el.innerHTML=`<span class="n">${md(dd)} ${WD_CN[dd.getDay()]}</span><span class="scopepill">${cn[lv.scope]}</span><span class="x">×</span>`;
    el.querySelector('.x').onclick=()=>{c.leaves=c.leaves.filter(x=>x!==lv); renderLeaves(c); renderDetail();};
    box.appendChild(el);
  });
}

/* ---------- 渲染：假日 ---------- */
function renderHolidays(){
  const list=document.getElementById('holList'); list.innerHTML='';
  HOLIDAYS[state.year].forEach(([d,name])=>{
    const on=state.holEnabled.has(d); const dd=parse(d);
    const el=document.createElement('div'); el.className='hol'+(on?' on':'');
    el.innerHTML=`<span class="chk">${on?'✓':''}</span><span class="hdate">${d.slice(5)} ${WD_CN[dd.getDay()]}</span><span class="hname">${name}</span>`;
    el.onclick=()=>{ if(state.holEnabled.has(d))state.holEnabled.delete(d);else state.holEnabled.add(d); renderHolidays(); renderDetail(); };
    list.appendChild(el);
  });
}

/* ---------- 渲染：单班明细 ---------- */
function chipColor(c){return c.exam?EXAM[c.exam].color:TYPES[c.type].color;}
function chipLabel(c){return c.exam==='bilan'?'Bil':c.exam==='mid'?'期中':c.exam==='final'?'期末':TYPES[c.type].short+c.idx;}
function renderDetail(){
  const c=active(); const root=document.getElementById('detail');
  const r=computeSchedule(c);
  if(r.error){ root.innerHTML=`<div class="card"><div class="empty">${r.error}，请在上方补齐后查看日程。</div></div>`; return; }
  const seq=r.seq, m=milestones(seq);
  const stat=(k,v)=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  let html=`<div class="summary">${stat('开班',md(m.open))}${stat('结课',md(m.close))}${stat('总课时','29 堂')}${stat('跨越周数',m.weeks+' 周')}</div>`;
  html+='<div class="exam-cards">';
  const ord=c.mode==='full'?['mid','final','bilan']:['mid','final'];
  ord.forEach(k=>{const cc=seq.find(x=>x.exam===k); if(!cc)return;
    html+=`<div class="ecard" style="background:${EXAM[k].color}"><div class="lbl">${EXAM[k].name}</div><div class="d">${md(cc.date)}</div><div class="w">${WD_CN[cc.date.getDay()]} · ${cc.type==='WJ'?'外教':'中教'}第 ${cc.idx} 堂</div></div>`;});
  html+='</div>';
  html+=`<div class="card"><div class="chead"><h3>${c.name} · 课程日程</h3>
    <div class="viewtabs" id="viewTabs">
      <button data-v="chips"${state.view==='chips'?' class="on"':''}>节奏条</button>
      <button data-v="table"${state.view==='table'?' class="on"':''}>明细表</button>
      <button data-v="cal"${state.view==='cal'?' class="on"':''}>日历</button>
    </div></div><div id="viewBody"></div>
    <div class="legend">
      <div class="li"><span class="sw" style="background:${TYPES.A0.color}"></span>A0 语音</div>
      <div class="li"><span class="sw" style="background:${TYPES.ZJ.color}"></span>中教 知识</div>
      <div class="li"><span class="sw" style="background:${TYPES.WJ.color}"></span>外教 口语</div>
      <div class="li"><span class="sw" style="background:${EXAM.mid.color}"></span>期中 / 期末</div>
      <div class="li"><span class="sw" style="background:${EXAM.bilan.color}"></span>Bilan</div>
    </div></div>`;
  root.innerHTML=html;
  root.querySelectorAll('#viewTabs button').forEach(b=>b.onclick=()=>{state.view=b.dataset.v; renderViewBody(seq);});
  renderViewBody(seq);
}
function renderViewBody(seq){
  const body=document.getElementById('viewBody');
  if(state.view==='chips'){
    let h='<div class="chips">';
    seq.forEach((c,i)=>{ if(i===3)h+='<span class="chip sep">▮</span>';
      h+=`<span class="chip" style="background:${chipColor(c)}"><span class="cn">${chipLabel(c)}</span><span class="cd">${md(c.date)}</span></span>`;});
    body.innerHTML=h+'</div>';
  } else if(state.view==='table'){
    let h='<div class="tblwrap"><table><thead><tr><th>#</th><th>日期</th><th>星期</th><th>科目</th><th>本科第几堂</th><th>备注</th></tr></thead><tbody>';
    seq.forEach(c=>{const cls=c.exam==='bilan'?'bilan':(c.exam?'exam':'');
      const tn=c.type==='A0'?'A0 语音':(c.type==='ZJ'?'中教':'外教');
      const note=c.exam?`<span class="badge" style="background:${EXAM[c.exam].color}">${EXAM[c.exam].name}</span>`:'';
      h+=`<tr class="${cls}"><td class="n">${c.seq}</td><td class="n">${fmt(c.date)}</td><td>${WD_CN[c.date.getDay()]}</td><td><span class="tag"><span class="sw" style="background:${TYPES[c.type].color}"></span>${tn}</span></td><td class="n">第 ${c.idx} 堂</td><td>${note}</td></tr>`;});
    body.innerHTML=h+'</tbody></table></div>';
  } else body.innerHTML=renderCalendar(seq);
}
function renderCalendar(seq){
  const byDate={}; seq.forEach(c=>{const k=fmt(c.date);(byDate[k]=byDate[k]||[]).push(c);});
  const first=seq[0].date,last=seq[seq.length-1].date; const months=[]; let m=new Date(first.getFullYear(),first.getMonth(),1);
  while(m<=last){months.push(new Date(m)); m.setMonth(m.getMonth()+1);}
  let h='<div class="cal">';
  months.forEach(mo=>{const y=mo.getFullYear(),mon=mo.getMonth();
    h+=`<div class="month"><h4>${y} 年 ${mon+1} 月</h4><div class="mgrid">`;
    ['一','二','三','四','五','六','日'].forEach(w=>h+=`<div class="wd">${w}</div>`);
    let lead=(new Date(y,mon,1).getDay()+6)%7; for(let i=0;i<lead;i++)h+='<div></div>';
    const dim=new Date(y,mon+1,0).getDate();
    for(let dn=1;dn<=dim;dn++){const ds=`${y}-${pad(mon+1)}-${pad(dn)}`; const cs=byDate[ds]; const isHol=state.holEnabled.has(ds);
      let cls='cell'; if(isHol)cls+=' hol';
      if(cs){cls+=' has'; if(cs.some(c=>c.exam==='bilan'))cls+=' bil'; else if(cs.some(c=>c.exam))cls+=' exam';}
      let dots=''; if(cs)cs.forEach(c=>dots+=`<span class="cdot" style="background:${chipColor(c)}"></span>`);
      h+=`<div class="${cls}"><span class="dd">${dn}</span><span class="cdots">${dots}</span></div>`;}
    h+='</div></div>';});
  return h+'</div>';
}

/* ---------- 渲染：汇总总览 ---------- */
function renderOverview(){
  const t=document.getElementById('ovTable');
  let h='<thead><tr><th>班级</th><th>班型</th><th>开班</th><th>A0 完成</th><th>期中</th><th>期末</th><th>Bilan</th><th>结课</th><th>周数</th></tr></thead><tbody>';
  state.classes.forEach(c=>{
    const r=computeSchedule(c); const mt=c.mode==='full'?'全日制':'兼读制';
    if(r.error){ h+=`<tr><td>${esc(c.name)}</td><td>${mt}</td><td class="err" colspan="7">${r.error}</td></tr>`; return; }
    const m=milestones(r.seq);
    const wd=d=>d?`${md(d)} ${WD_CN[d.getDay()]}`:'—';
    h+=`<tr><td><b>${esc(c.name)}</b></td><td>${mt}</td><td class="n">${wd(m.open)}</td><td class="n">${wd(m.a0)}</td><td class="n mid">${wd(m.mid)}</td><td class="n fin">${wd(m.final)}</td><td class="n bil">${wd(m.bilan)}</td><td class="n">${wd(m.close)}</td><td class="n">${m.weeks}</td></tr>`;
  });
  t.innerHTML=h+'</tbody>';
}
const esc=s=>String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));

/* ---------- 复制 / 导出 ---------- */
function ovTSV(){
  const head=['班级','班型','开班','A0完成','期中','期末','Bilan','结课','周数'];
  const rows=[head.join('\t')];
  state.classes.forEach(c=>{
    const r=computeSchedule(c); const mt=c.mode==='full'?'全日制':'兼读制';
    if(r.error){ rows.push([c.name,mt,r.error,'','','','','',''].join('\t')); return; }
    const m=milestones(r.seq); const f=d=>d?fmt(d):'';
    rows.push([c.name,mt,f(m.open),f(m.a0),f(m.mid),f(m.final),f(m.bilan),f(m.close),m.weeks].join('\t'));
  });
  return rows.join('\n');
}
function detailTSV(){
  const rows=[['班级','班型','序号','日期','星期','科目','本科第几堂','备注'].join('\t')];
  state.classes.forEach(c=>{
    const r=computeSchedule(c); const mt=c.mode==='full'?'全日制':'兼读制';
    if(r.error){ rows.push([c.name,mt,'',r.error,'','','',''].join('\t')); return; }
    r.seq.forEach(x=>{const tn=x.type==='A0'?'A0语音':(x.type==='ZJ'?'中教':'外教');
      rows.push([c.name,mt,x.seq,fmt(x.date),WD_CN[x.date.getDay()],tn,'第'+x.idx+'堂',x.exam?EXAM[x.exam].name:''].join('\t'));});
  });
  return rows.join('\n');
}
function copyText(txt,msg){
  const done=()=>toast(msg||'已复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  } else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy'); cb();}catch(e){toast('复制失败，请用「下载 CSV」');}
  document.body.removeChild(ta);
}
function download(name,text){
  const blob=new Blob(['\ufeff'+text.replace(/\t/g,',')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('已下载 CSV');
}
let toastT;
function toast(m){const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1800);}

/* ---------- 事件 ---------- */
document.getElementById('addClass').onclick=()=>{const c=newClass(); state.classes.push(c); state.activeId=c.id; renderAll();};
document.querySelectorAll('.maintabs button').forEach(b=>b.onclick=()=>{
  state.tab=b.dataset.tab;
  document.querySelectorAll('.maintabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('tab-setup').style.display=state.tab==='setup'?'':'none';
  document.getElementById('tab-overview').style.display=state.tab==='overview'?'':'none';
  if(state.tab==='overview') renderOverview();
});
document.querySelectorAll('#yearTabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#yearTabs button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  state.year=+b.dataset.year; renderHolidays();
});
document.getElementById('holAll').onclick=()=>{HOLIDAYS[state.year].forEach(([d])=>state.holEnabled.add(d)); renderHolidays(); renderDetail();};
document.getElementById('holNone').onclick=()=>{HOLIDAYS[state.year].forEach(([d])=>state.holEnabled.delete(d)); renderHolidays(); renderDetail();};
document.getElementById('copyOv').onclick=()=>copyText(ovTSV(),'汇总表已复制，可贴到 Excel');
document.getElementById('copyDetail').onclick=()=>copyText(detailTSV(),'全部明细已复制');
document.getElementById('dlCsv').onclick=()=>download('MLI排课汇总.csv',ovTSV());
document.getElementById('printBtn').onclick=()=>{renderOverview(); window.print();};

/* ---------- 初始化 ---------- */
function renderAll(){ renderClassList(); renderEditor(); renderDetail(); if(state.tab==='overview')renderOverview(); }
renderHolidays(); renderAll();
</script>
