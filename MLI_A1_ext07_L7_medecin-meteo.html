<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leçon 7 : Chez le médecin, la météo & les vêtements — Exercices (TCF)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--green:#5DB88A;--dark:#1C2333;--ink:#334155;--line:#D0DDE8;}
html,body{height:100%;}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;background:#EEF3F8;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;}
/* ---------- header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:.7rem;position:relative;background:#fff;border-bottom:1px solid var(--line);padding:.5rem 1rem;flex-shrink:0;z-index:60;}
.hdr-left{display:flex;align-items:center;gap:.8rem;}
.hdr-logo{height:30px;width:auto;}
.hdr-sep{width:1px;height:24px;background:var(--line);}
.hdr-info{display:flex;flex-direction:column;line-height:1.15;}
.hdr-num{font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green);}
.hdr-title{font-size:.82rem;font-weight:700;color:var(--dark);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-zoom-wrap{display:flex;align-items:center;gap:.5rem;position:absolute;left:50%;transform:translateX(-50%);}
.zoom-label{font-size:.68rem;font-weight:700;color:#64748b;min-width:38px;text-align:right;}
.zoom-slider{width:120px;accent-color:var(--green);cursor:pointer;}
.hdr-right{display:flex;align-items:center;gap:.7rem;}
.fs-btn{font-size:.7rem;font-weight:700;color:#475569;background:#fff;border:1.4px solid var(--line);border-radius:8px;padding:.32rem .6rem;cursor:pointer;white-space:nowrap;}
.fs-btn:hover{border-color:var(--green);color:var(--green);}
.hdr-badge{font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .65rem;border-radius:20px;background:var(--green);color:#fff;white-space:nowrap;}
/* ---------- stage ---------- */
.stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:1.2rem;}
.slide-wrap{width:960px;transform-origin:center center;transition:transform .18s ease;}
.slide{width:960px;min-height:540px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(20,40,70,.14);overflow:hidden;display:flex;flex-direction:column;}
/* ---------- cover ---------- */
.cover-slide{width:960px;min-height:540px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(20,40,70,.14);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2.4rem;position:relative;}
.cover-logo-wrap{margin-bottom:1.4rem;}
.cover-logo{height:54px;width:auto;}
.cover-body{max-width:760px;}
.cover-badge{display:inline-block;padding:.28rem 1rem;border-radius:20px;font-size:.7rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:1rem;}
.cover-icon{font-size:2.6rem;margin-bottom:.5rem;}
.cover-title{font-size:2rem;font-weight:800;line-height:1.2;margin-bottom:.7rem;}
.cover-sub{font-size:1rem;color:#5E6C84;margin-bottom:1.3rem;}
.cover-plan{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;}
.cover-plan-item{font-size:.82rem;font-weight:700;padding:.4rem .9rem;border-radius:12px;border:1.5px solid;}
.cover-bar{position:absolute;left:0;bottom:0;height:8px;width:100%;}
/* ---------- content slide ---------- */
.content-slide{width:960px;min-height:540px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(20,40,70,.14);overflow:hidden;display:flex;flex-direction:column;}
.slide-hdr{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.6rem;}
.slide-hdr-left{display:flex;align-items:center;gap:.75rem;}
.slide-dot{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;flex-shrink:0;}
.slide-lnum{font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);}
.slide-title{font-size:1.28rem;font-weight:800;color:var(--dark);line-height:1.15;}
.type-pill{font-size:.66rem;font-weight:800;padding:.28rem .7rem;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.slide-body{flex:1;padding:.4rem 1.6rem 1.6rem;font-size:1rem;line-height:1.5;overflow:auto;}
.slide-body ul{margin:.3rem 0 .3rem 1.3rem;}
.slide-body li{margin:.28rem 0;}
.slide-body img{max-width:100%;height:auto;display:block;margin:.4rem auto;border-radius:8px;}
.consigne{background:var(--tint);border-left:4px solid var(--acc);border-radius:8px;padding:.6rem .85rem;font-weight:600;color:#243244;margin-bottom:.7rem;}
.mini{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin:.5rem 0 .25rem;}
.wordbank{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.5rem;}
.wordbank span{background:#F1F5F9;border:1px solid #E2E8F0;border-radius:20px;padding:.24rem .7rem;font-size:.85rem;font-weight:600;color:#334155;}
.tip{background:#FFF7E6;border:1px solid #F5D78E;border-radius:8px;padding:.5rem .8rem;font-size:.9rem;margin-top:.6rem;color:#7A5B12;}
.tcf{background:#EAF3FF;border:1px solid #A9CBF5;border-radius:8px;padding:.5rem .8rem;font-size:.88rem;margin-top:.6rem;color:#1D4E89;}
.tcf b{color:#123c73;}
/* fiche / role tables */
.gtable{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:.86rem;}
.gtable th,.gtable td{border:1px solid #E2E8F0;padding:.4rem .55rem;text-align:left;}
.gtable th{background:var(--tint);font-weight:800;color:#243244;}
.two{display:flex;gap:.8rem;flex-wrap:wrap;}
.rolecard{flex:1;min-width:240px;border:1.5px solid #E2E8F0;border-radius:12px;padding:.7rem .9rem;}
.rolecard.a{background:#E8F4FB;border-color:#9DD3EF;}
.rolecard.b{background:#F3EEF9;border-color:#C9B6E6;}
.rc-h{font-weight:800;margin-bottom:.35rem;color:#243244;}
/* V/F & QCM */
.qcmset{margin:.5rem 0;}
.vf{width:100%;border-collapse:collapse;font-size:.9rem;}
.vf th,.vf td{border:1px solid #E2E8F0;padding:.42rem .5rem;text-align:center;}
.vf th{background:var(--tint);font-weight:800;color:#243244;}
.vf td.q{text-align:left;}
.qcm-o{cursor:pointer;user-select:none;font-weight:700;color:#94a3b8;}
.qcm-o.sel{color:var(--acc);}
.c.qcm-o.sel{background:var(--tint);}
.qcm-q.ok{background:#E9F9EF;}
.qcm-q.no{background:#FDECEC;}
/* button-choice rows (être/avoir type) */
.hf-row{display:flex;align-items:center;gap:.5rem;padding:.4rem .3rem;border-bottom:1px solid #EEF2F6;}
.hf-n{width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--acc);font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hf-label{font-weight:600;}
.hf-opt{background:#fff;border:1.5px solid #CBD5E1;border-radius:8px;padding:.26rem .7rem;font-weight:700;font-size:.9rem;cursor:pointer;color:#475569;}
.hf-opt.sel{border-color:var(--acc);color:var(--acc);background:var(--tint);}
.hf-row.ok{background:#E9F9EF;}.hf-row.no{background:#FDECEC;}
/* gaps */
.gapset{margin:.4rem 0;}
.gap-line{line-height:2.1;font-size:.95rem;}
.gap{border:none;border-bottom:2px solid var(--acc);background:#F8FAFC;font-size:.95rem;padding:.12rem .3rem;font-family:inherit;color:#0f172a;outline:none;min-width:60px;}
.gap.ok{border-color:#22c55e;background:#E9F9EF;}
.gap.no{border-color:#ef4444;background:#FDECEC;}
.gapbtns{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;flex-wrap:wrap;}
.gap-check,.gap-show{border:none;border-radius:8px;padding:.34rem .8rem;font-weight:700;font-size:.85rem;cursor:pointer;}
.gap-check{background:var(--acc);color:#fff;}
.gap-show{background:#EEF2F6;color:#475569;}
.gapmsg{font-weight:800;font-size:.9rem;}
/* number dictation grid */
.ngrid{display:grid;gap:.5rem;margin:.5rem 0;}
.ncell{display:flex;flex-direction:column;align-items:center;gap:.2rem;}
.nlab{font-size:.72rem;font-weight:800;color:#94a3b8;}
.nbox{width:100%;height:44px;border:1.5px solid #CBD5E1;border-radius:8px;text-align:center;font-size:1.1rem;font-weight:700;color:#0f172a;outline:none;}
.nbox:focus{border-color:var(--acc);}
/* svg illus */
.svg-illus{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin:.5rem 0;}
.svg-card{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;padding:.5rem;display:flex;flex-direction:column;align-items:center;}
.svg-card .cap{margin-top:.25rem;font-weight:800;color:#64748b;}
/* audio */
.afile{background:#F0FBF5;border:1px solid #BFE7D0;border-radius:10px;padding:.6rem .8rem;margin:.5rem 0;}
.afile-head{font-size:.82rem;font-weight:700;color:#2f7a52;margin-bottom:.4rem;}
.afile code{background:#DDF3E6;padding:.05rem .35rem;border-radius:5px;font-size:.8rem;}
.afile audio{width:100%;}
/* reveal */
.rvl-btn{margin-top:.7rem;background:#F1F5F9;border:1px solid #E2E8F0;border-radius:8px;padding:.4rem .8rem;font-weight:700;font-size:.85rem;color:#475569;cursor:pointer;}
.rvl-btn.open{background:var(--tint);color:var(--acc);}
.rvl-box{display:none;margin-top:.5rem;}
.rvl-box.show{display:block;}
.tr-box{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:.7rem .9rem;margin-bottom:.5rem;}
.tr-title{font-weight:800;color:#334155;margin-bottom:.35rem;font-size:.85rem;}
.tr-line{font-size:.9rem;margin:.2rem 0;line-height:1.45;}
.ans-line{font-size:.9rem;font-weight:700;color:#2f7a52;margin:.15rem 0;}
.kbadge{display:inline-block;background:#FEF3C7;border:1px solid #FCD34D;border-radius:6px;padding:.1rem .5rem;font-size:.82rem;font-weight:800;color:#92610a;margin-top:.4rem;}
/* notes */
.notes-area{border:1.5px dashed #CBD5E1;border-radius:10px;padding:.6rem .8rem;font-size:.95rem;color:#0f172a;outline:none;background:#FCFEFF;}
.notes-area:focus{border-color:var(--acc);border-style:solid;}
.write-placeholder{color:#94a3b8;}
/* nav */
.nav-bar{display:flex;align-items:center;justify-content:center;gap:1rem;background:#fff;border-top:1px solid var(--line);padding:.5rem 1rem;flex-shrink:0;z-index:60;}
.nav-btn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:1.1rem;color:#475569;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.nav-btn:hover:not(:disabled){border-color:var(--green);color:var(--green);background:#5DB88A0d;}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.nav-btn.done{background:var(--green);color:#fff;border-color:var(--green);cursor:default;opacity:1;}
.nav-count{font-size:.85rem;font-weight:800;color:#64748b;min-width:70px;text-align:center;}
/* accent keyboard */
.acc-bar{display:none;align-items:center;gap:.3rem;flex-wrap:wrap;justify-content:center;background:#0F1B2A;padding:.4rem;position:fixed;left:50%;bottom:64px;transform:translateX(-50%);border-radius:12px;z-index:130;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.acc-bar.on{display:flex;}
.acc-bar button{background:#1e2f45;border:1px solid #33465f;color:#e8eef5;border-radius:7px;min-width:30px;height:30px;font-size:.95rem;cursor:pointer;}
.acc-bar button:hover{background:#2a3f5b;}
.acc-bar .wc{color:#8fb7e0;font-size:.75rem;font-weight:700;padding:0 .4rem;}
/* present / fullscreen mode */
/* fullscreen keeps the normal white layout: header on top, nav on bottom, slide centred */
body.present{background:#EEF3F8;}
body.present .stage{padding:1.4rem;}
@media(max-width:1040px){.hdr-zoom-wrap{display:none;}.hdr-title{max-width:150px;}}
</style>
</head>

esse: Non, ce n'est pas grave, mais je vous conseille de rester au lit deux ou trois jours. Un homme: Mais j'ai beaucoup de travail, docteur. La doctoresse: Le travail peut attendre, monsieur Lemaire, vous êtes malade ! Vous devez vous reposer un peu. Un homme: Oui docteur... Je pense que vous avez raison. La doctoresse: Alors, vous allez prendre quelques jours de repos. Je ne vous donne pas trop de médicaments... Voilà l'ordonnance. Prenez trois comprimés le matin, à midi et le soir, avant les repas. Un homme: Bien, docteur. La doctoresse: Allez, monsieur Lemaire, rentrez vite à la maison et reposez-vous ! Un homme: Merci docteur. Je paie à la secrétaire, comme d'habitude ? La doctoresse: Oui, merci. Au revoir, monsieur Lemaire.</div></div><div class=\"ans-line\">✅ Mal à la gorge, il tousse, un peu de fièvre → angine (VRAI)</div><div class=\"ans-line\">✅ Pas le ventre (FAUX)</div><div class=\"ans-line\">✅ Rester au lit 2–3 jours (VRAI)</div><div class=\"ans-line\">✅ 3 comprimés : matin, midi, soir (VRAI)</div><div class=\"ans-line\">✅ Avant les repas, pas après (FAUX)</div><div class=\"ans-line\">✅ Il tousse beaucoup (VRAI)</div><div class=\"ans-line\">✅ Il a un peu de fièvre (VRAI)</div><div class=\"ans-line\">✅ Il a beaucoup de travail (FAUX)</div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#D4840A;--tint:#FDF3E3\"><div class=\"slide-hdr\" style=\"background:#FDF3E3;border-left:5px solid #D4840A\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#D4840A\">✍️</span><div><div class=\"slide-lnum\">COD / COI</div><div class=\"slide-title\">le / la / les / lui / leur</div></div></div><span class=\"type-pill\" style=\"background:#D4840A18;color:#D4840A;border:1.5px solid #D4840A40\">⌨️ Grammaire</span></div><div class=\"slide-body\"><div class=\"consigne\">Remplace le mot souligné par le bon pronom.</div><div class=\"gapset\"><div class=\"gap-line\">1. Je prends <u>le médicament</u>. → Je <input class=\"gap\" data-a=\"le\" const N=S.length;let cur=0;
const wrap=document.getElementById('wrap');
function render(i,smooth){
  cur=i;
  wrap.innerHTML=S[i];
  document.getElementById('nc').textContent=(i+1)+' / '+N;
  document.getElementById('pv').disabled=(i===0);
  const nx=document.getElementById('nx');
  if(i===N-1){nx.className='nav-btn done';nx.textContent='✓';nx.disabled=true;}
  else{nx.className='nav-btn';nx.textContent='→';nx.disabled=false;}
  wrap.querySelectorAll('.notes-area').forEach(clearPH);
  const zv=parseInt(document.getElementById('zr').value);applyZoom(zv);requestAnimationFrame(()=>applyZoom(zv));wrap.querySelectorAll('img').forEach(im=>{if(!im.complete)im.addEventListener('load',()=>applyZoom(parseInt(document.getElementById('zr').value)),{once:true});});
  if(smooth)wrap.animate([{opacity:.3},{opacity:1}],{duration:160});
}
function go(d){const n=cur+d;if(n>=0&&n<N)render(n,true);}
/* clearPH: hide placeholder on typing */
function clearPH(el){
  el.addEventListener('focus',()=>{const p=el.querySelector('.write-placeholder');if(p)p.style.display='none';});
  el.addEventListener('blur',()=>{const p=el.querySelector('.write-placeholder');if(p&&el.innerText.trim()==='')p.style.display='';});
}
/* --- interactive: V/F & button choices --- */
function pickOpt(el){
  const row=el.closest('.qcm-q');
  row.querySelectorAll('.qcm-o').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  row.classList.remove('ok','no');
}
function checkChoices(btn){
  const set=btn.closest('.qcmset');let good=0,tot=0;
  set.querySelectorAll('.qcm-q').forEach(row=>{
    tot++;const want=row.getAttribute('data-a');
    const sel=row.querySelector('.qcm-o.sel');
    row.classList.remove('ok','no');
    if(sel&&sel.getAttribute('data-v')===want){good++;row.classList.add('ok');}
    else row.classList.add('no');
  });
  const msg=set.querySelector('.gapmsg');
  msg.textContent=good+' / '+tot;
  msg.style.color=(good===tot)?'#16a34a':'#dc2626';
}
/* --- interactive: gap fill --- */
function norm(s){return (s||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[.;!?]+$/,'');}
function checkGaps(btn){
  const set=btn.closest('.gapset');let good=0,tot=0;
  set.querySelectorAll('.gap').forEach(inp=>{
    tot++;const ok=(inp.getAttribute('data-a')||'').split('|').map(norm);
    inp.classList.remove('ok','no');
    if(ok.includes(norm(inp.value))){good++;inp.classList.add('ok');}
    else inp.classList.add('no');
  });
  const msg=set.querySelector('.gapmsg');
  msg.textContent=good+' / '+tot;msg.style.color=(good===tot)?'#16a34a':'#dc2626';
}
function showGaps(btn){
  const set=btn.closest('.gapset');
  set.querySelectorAll('.gap').forEach(inp=>{
    inp.value=(inp.getAttribute('data-a')||'').split('|')[0];
    inp.classList.remove('no');inp.classList.add('ok');
  });
  const msg=set.querySelector('.gapmsg');if(msg){msg.textContent='👁';msg.style.color='#64748b';}
}
/* --- zoom --- */
function applyZoom(v){
  document.getElementById('zl').textContent=v+'%';
  document.getElementById('zr').value=v;
  const st=document.getElementById('stage');
  const w=document.getElementById('wrap');
  w.style.transform='none';
  const cw=w.offsetWidth||960, ch=w.offsetHeight||560;
  const availW=st.clientWidth-28, availH=st.clientHeight-28;
  let base=Math.min(availW/cw, availH/ch, 1.15);
  if(base<0.3)base=0.3;
  w.style.transform='scale('+(base*v/100)+')';
}
document.getElementById('zr').addEventListener('input',e=>applyZoom(parseInt(e.target.value)));
window.addEventListener('resize',()=>applyZoom(parseInt(document.getElementById('zr').value)));
/* --- fullscreen / present --- */
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
function toggleFS(){
  if(!fsEl()){(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement);}
  else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
}
function onFS(){
  if(fsEl()){document.body.classList.add('present');document.querySelector('.fs-txt').textContent='Quitter';}
  else{document.body.classList.remove('present');document.querySelector('.fs-txt').textContent='Plein écran';}
  setTimeout(()=>applyZoom(parseInt(document.getElementById('zr').value)),80);
}
document.addEventListener('fullscreenchange',onFS);
document.addEventListener('webkitfullscreenchange',onFS);
/* --- keyboard nav --- */
document.addEventListener('keydown',e=>{
  const t=e.target;const typing=t.isContentEditable||t.tagName==='INPUT'||t.tagName==='TEXTAREA';
  if(['ArrowRight',' '].includes(e.key)&&!typing){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'&&!typing){e.preventDefault();go(-1);}
  if((e.key==='f'||e.key==='F')&&!typing){toggleFS();}
});
/* --- touch swipe --- */
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>55&&!document.activeElement.isContentEditable&&document.activeElement.tagName!=='INPUT')go(dx<0?1:-1);
},{passive:true});
/* --- accent keyboard --- */
let curEd=null;
const accBar=document.getElementById('accBar');
function edOf(t){return t&&t.closest?t.closest('[contenteditable="true"],input.gap,input[type=text],textarea'):null;}
document.addEventListener('focusin',e=>{const ed=edOf(e.target);if(ed){curEd=ed;accBar.classList.add('on');updCount();}});
document.addEventListener('focusout',e=>{setTimeout(()=>{if(!edOf(document.activeElement)){accBar.classList.remove('on');}},120);});
accBar.querySelectorAll('button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
function ins(ch){
  if(!curEd)return;
  if(curEd.isContentEditable){document.execCommand('insertText',false,ch);}
  else{const s=curEd.selectionStart,en=curEd.selectionEnd,v=curEd.value;curEd.value=v.slice(0,s)+ch+v.slice(en);curEd.selectionStart=curEd.selectionEnd=s+1;}
  updCount();curEd.focus();
}
function updCount(){
  if(!curEd)return;
  const txt=curEd.isContentEditable?curEd.innerText:curEd.value;
  const n=(txt.trim().match(/\S+/g)||[]).length;
  document.getElementById('wc').textContent=n+(n>1?' mots':' mot');
}
document.addEventListener('input',e=>{if(edOf(e.target))updCount();});
/* init */
render(0,false);
</script>
